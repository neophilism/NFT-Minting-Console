name: Offline development reproduction
on:
  pull_request:
    paths:
      - '.github/workflows/developer-reproduction.yml'
permissions:
  contents: read
jobs:
  source-and-locked-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export tracked public source before checks for offline failure reproduction
        run: |
          git archive --format=tar.gz HEAD > /tmp/nft-public-source.tar.gz
          sha256sum /tmp/nft-public-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nft-public-source
          path: /tmp/nft-public-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Package only tracked public source and locked build tools, never credentials or git metadata
        run: |
          git archive --format=tar HEAD > /tmp/nft-developer-source.tar
          tar -rf /tmp/nft-developer-source.tar node_modules artifacts cache
          gzip -1 /tmp/nft-developer-source.tar
          sha256sum /tmp/nft-developer-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nft-offline-reproduction
          path: /tmp/nft-developer-source.tar.gz
          retention-days: 1
          compression-level: 0
