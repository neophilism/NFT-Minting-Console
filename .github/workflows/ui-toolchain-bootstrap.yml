name: UI toolchain bootstrap
on:
  pull_request:
    paths: ['.github/workflows/ui-toolchain-bootstrap.yml']
permissions:
  contents: read
jobs:
  import-reviewed-lock:
    if: github.head_ref == 'codex/nft15-react-console' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'neophilism'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11773602296'
          run-id: '38308720763'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/reviewed-ui-toolchain
          merge-multiple: true
      - name: Verify exact reviewed bytes and commit only package files
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cd "$RUNNER_TEMP/reviewed-ui-toolchain"
          echo 'e0cc69588c023d1f316290e3be61db6e503a99b3fb5810dd57629b05d4d32d97  package.json' | sha256sum -c -
          echo '6bcc917b7e7cff9317347ebf8b3deb839b1efe6c941fa73cc2f6adb649a5b676  package-lock.json' | sha256sum -c -
          echo '0bfbca7e38ae7cc098b9a2518afb9bd1640214a54047c4e5026bce652dfcf285  ui-versions.json' | sha256sum -c -
          cp package.json package-lock.json "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(ui): pin the reviewed React and browser-test dependency graph'
          # Non-forced push rejects a moved feature branch. Never target main,
          # merge a PR, change checks, or re-resolve latest dependencies here.
          git push origin HEAD:refs/heads/codex/nft15-react-console
