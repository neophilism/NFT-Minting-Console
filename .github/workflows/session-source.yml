name: Session tracked source
on:
  push:
    branches: [work/nft23-durable-transactions-20261012]
    paths: [.github/workflows/session-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/nft-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/nft-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/nft-source/COMMIT"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/nft-source/TREE"
          cd "$RUNNER_TEMP/nft-source"
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tracked-source-${{ github.run_id }}
          path: ${{ runner.temp }}/nft-source/
          retention-days: 1
          if-no-files-found: error
