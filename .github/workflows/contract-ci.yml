name: NFT Console CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile Solidity
        run: npm run compile
      - name: Lint JavaScript
        run: npm run lint
      - name: Type-check sources
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Rehearse two disposable factory-to-mint releases
        run: npm run mint:rehearse
      - name: Retain synthetic mint receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mint-rehearsal-${{ github.run_id }}
          path: artifacts/rehearsal/mint-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify migrations and release isolation
        run: npm run test:data
      - name: Verify wallet authentication, HTTP and browser controls
        run: npm run test:auth
      - name: Verify UI validation models
        run: npm run test:ui:model
      - name: Verify archived and pending AOTV rights separation
        run: npm run test:rights:aotv
      - name: Audit production dependencies
        run: npm run security:scan
      - name: Build application
        run: npm run build

  real-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: limitbreakinc/creator-token-transfer-validator
          ref: 59adb8b36ab0256c7430b017b1c9f8b4841d6e1e
          path: vendor/creator-token-transfer-validator
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.3.6
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned validator checkout
        run: test "$(git -C vendor/creator-token-transfer-validator rev-parse HEAD)" = "59adb8b36ab0256c7430b017b1c9f8b4841d6e1e"
      - name: Compile application collection artifact
        run: npm run compile
      - name: Run real-validator integration and adversarial tests
        run: npm run test:integration

  e2eesa-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: neophilism/End-To-End-Everywhere-Security-Architecture-Standard
          ref: 2883c792a766ae6ca860abb6fbe8b1654ba9d7de
          path: vendor/e2eesa
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
      - name: Check exact source and scoped configurations
        run: python3 scripts/check_security_profiles.py --output /tmp/e2eesa-configuration-report.json
      - name: Require the committed report to match its inputs
        run: cmp security/configuration-report.json /tmp/e2eesa-configuration-report.json
      - name: Reject invalid scope, dependencies, crosswalks and evidence claims
        run: python3 -m unittest discover -s test-security -v
