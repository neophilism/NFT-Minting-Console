name: NFT Console CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile Solidity
        run: npm run compile
      - name: Lint JavaScript
        run: npm run lint
      - name: Type-check sources
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Audit production dependencies
        run: npm run security:scan
      - name: Build application
        run: npm run build

  real-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: limitbreakinc/creator-token-transfer-validator
          ref: 59adb8b36ab0256c7430b017b1c9f8b4841d6e1e
          path: vendor/creator-token-transfer-validator
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.3.6
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned validator checkout
        run: test "$(git -C vendor/creator-token-transfer-validator rev-parse HEAD)" = "59adb8b36ab0256c7430b017b1c9f8b4841d6e1e"
      - name: Compile application collection artifact
        run: npm run compile
      - name: Run real-validator integration and adversarial tests
        run: npm run test:integration

  e2eesa-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: neophilism/End-To-End-Everywhere-Security-Architecture-Standard
          ref: 6ec85d51f9207da31f0e90fd8a7c82ffff8448f6
          path: vendor/e2eesa
          persist-credentials: false
      - name: Verify pinned E2EESA inputs
        shell: bash
        run: |
          test "$(git -C vendor/e2eesa rev-parse HEAD)" = "6ec85d51f9207da31f0e90fd8a7c82ffff8448f6"
          test "$(git -C vendor/e2eesa hash-object profiles/catalog.json)" = "87fac03bca714ff22e30cc3abf3260f80a8462ae"
          test "$(git -C vendor/e2eesa hash-object registry/security-properties.json)" = "bd4d6bf125bea69ef9b6cd5df836816e428477a4"
      - name: Resolve candidate profile
        run: |
          python vendor/e2eesa/scripts/profile_engine.py \
            vendor/e2eesa/profiles/catalog.json \
            security/e2eesa-configuration.json \
            --property-registry vendor/e2eesa/registry/security-properties.json \
            | tee /tmp/e2eesa-resolution.json
      - name: Require a valid dependency resolution
        run: |
          python - <<'PY'
          import json
          with open("/tmp/e2eesa-resolution.json", encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["valid"] is True
          assert result["errors"] == []
          PY
