name: Installation live readiness
on:
  pull_request:
    paths:
      - '.github/workflows/installation-live-check.yml'
      - 'docs/INSTALLATION_HANDOFF.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/installation-live-check.yml'
      - 'docs/INSTALLATION_HANDOFF.md'
permissions:
  contents: read
jobs:
  read-only-installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public setup state without reading secrets or registering a wallet
        run: |
          python3 - <<'PY'
          import datetime, json, urllib.request
          origin = 'https://nft-minting-console-preview.onrender.com'
          report = {'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'readOnly': True, 'credentialsRead': False, 'walletRegistered': False, 'pinataAuthenticated': False}
          passed = True
          for path in ['/api/health', '/api/setup/status', '/api/config']:
              try:
                  with urllib.request.urlopen(origin + path, timeout=75) as response:
                      raw = response.read(16385)
                      if response.status != 200 or len(raw) > 16384 or response.geturl() != origin + path:
                          raise ValueError('unexpected response')
                      value = json.loads(raw)
                      if not isinstance(value, dict):
                          raise ValueError('invalid JSON object')
                      if path.endswith('health'):
                          safe = {'ok': value.get('ok') is True}
                          passed = passed and safe['ok']
                      elif path.endswith('status'):
                          safe = {key: value.get(key) is True for key in ['required','databaseVerified','codeConfigured','runtimeReady','fullProductReady']}
                          safe['chainId'] = value.get('chainId') if type(value.get('chainId')) is int else None
                          passed = passed and value.get('version') == 1 and safe['databaseVerified'] and safe['chainId'] == 1
                          passed = passed and ((safe['required'] and safe['codeConfigured']) or (not safe['required'] and safe['runtimeReady']))
                      else:
                          safe = {key: value.get(key) is True for key in ['loginConfigured','pinningConfigured','productionReady']}
                          safe['chainId'] = value.get('chainId') if type(value.get('chainId')) is int else None
                          safe['authStore'] = value.get('authStore') if value.get('authStore') in ['postgresql','development-memory'] else 'other'
                          safe['publicLaunch'] = value.get('capabilities',{}).get('publicLaunch') is True
                          passed = passed and safe['chainId'] == 1 and safe['authStore'] == 'postgresql'
                      report[path] = safe
              except Exception as error:
                  report[path] = {'available': False, 'errorType': type(error).__name__}
                  passed = False
          report['installationReady'] = passed
          print(json.dumps(report, indent=2))
          with open('installation-live-check.json', 'w') as out:
              json.dump(report, out, indent=2)
          if not passed:
              raise SystemExit('Live installation is not ready; inspect the redacted report.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installation-live-check
          path: installation-live-check.json
          retention-days: 7
