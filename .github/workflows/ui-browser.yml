name: Browser UI acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ui-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:ui
      - run: npm run typecheck:ui
      - run: npm run test:ui:model
      - name: Install the pinned Playwright browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Desktop, mobile, wallet and accessibility acceptance
        run: npm run test:ui:browser
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-evidence-${{ github.run_id }}
          path: test-results/
          retention-days: 30
          if-no-files-found: error
